[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bergen-traffic-predictor"
version = "0.1.0"
description = "One-hour-ahead traffic-volume prediction for Bergen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["src*"]
